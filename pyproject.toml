[project]
name = "weightsmith"
version = "0.1.0"
description = "Visual ML architecture editor: graph IR → readable PyTorch → local training → run comparison"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.8",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
data = ["pandas>=2.2", "pyarrow>=17", "pillow>=10", "datasets>=3.0"]

[project.scripts]
weightsmith = "weightsmith_runtime.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "core/weightsmith_core",
  "codegen/weightsmith_codegen",
  "runtime/weightsmith_runtime",
  "importers/weightsmith_importers",
]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "weightsmith_core/_schema"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[tool.pytest.ini_options]
testpaths = ["tests"]
