[project]
name = "weightsmith"
version = "0.1.0"
description = "Visual ML architecture editor: graph IR → readable PyTorch → local training → run comparison"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.8",
  "numpy>=2.0",
  "pyyaml>=6.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jsonschema>=4.23",
  "pyarrow>=17",
  "trainscope",
]

[project.optional-dependencies]
data = ["pandas>=2.2", "pillow>=10", "datasets>=3.0"]
hf = ["safetensors>=0.4", "huggingface_hub>=0.25", "tokenizers>=0.20", "transformers>=4.45"]

[project.scripts]
weightsmith = "weightsmith_runtime.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiofiles>=23.0", "prometheus-client>=0.20", "ruptures>=1.1", "accelerate>=1.1", "lightning>=2.0", "ruff>=0.4", "mypy>=1.9", "types-PyYAML>=6.0", "httpx>=0.27", "safetensors>=0.4", "huggingface_hub>=0.25", "tokenizers>=0.20", "transformers>=4.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "core/weightsmith_core",
  "codegen/weightsmith_codegen",
  "runtime/weightsmith_runtime",
  "importers/weightsmith_importers",
]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "weightsmith_core/_schema"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.workspace]
members = ["trainscope"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
trainscope = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
